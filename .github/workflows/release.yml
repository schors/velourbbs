# Release of velourbbs on a version tag and deploy of the home BBS
# (docs/specs/release-deploy.md, sections 3 and 4).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  queue: max

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    environment: home
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          re='^v(0|1)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ ! $TAG =~ $re ]]; then
            echo "::error::The tag does not match $re"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag against main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" "refs/remotes/origin/main^{commit}"; then
            echo "::error::The commit of the tag is not in main"
            exit 1
          fi

      # The settings are secrets: GitHub masks them in the log (section 4.1).
      # Only the steps that use a setting get it.
      - name: Check the deploy settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          BBS_PORT: ${{ secrets.BBS_PORT }}
          KEY_SET: ${{ secrets.DEPLOY_SSH_KEY != '' }}
        run: |
          # The messages name the settings. They do not write their values.
          fail() {
            echo "::error::$1"
            exit 1
          }
          port() {
            [[ $1 =~ ^[1-9][0-9]{0,4}$ ]] && (($1 <= 65535))
          }
          for n in DEPLOY_HOST DEPLOY_USER DEPLOY_KNOWN_HOSTS BBS_PORT; do
            if [[ -z ${!n} ]]; then fail "The secret $n is missing"; fi
          done
          if [[ $KEY_SET != true ]]; then fail "The secret DEPLOY_SSH_KEY is missing"; fi
          if ! port "$BBS_PORT"; then fail "BBS_PORT is not a port number"; fi
          if [[ -n $DEPLOY_SSH_PORT ]] && ! port "$DEPLOY_SSH_PORT"; then
            fail "DEPLOY_SSH_PORT is not a port number"
          fi
          if [[ ! $DEPLOY_USER =~ ^[a-z_][a-z0-9_-]*$ ]]; then fail "DEPLOY_USER is not a user name"; fi
          if [[ ! $DEPLOY_HOST =~ ^[A-Za-z0-9.:-]+$ || $DEPLOY_HOST == -* ]]; then
            fail "DEPLOY_HOST is not a host name or address"
          fi

      - name: Keep only the tag of the run on the commit
        run: |
          git tag --points-at HEAD | while IFS= read -r t; do
            if [[ $t != "$TAG" ]]; then
              git update-ref -d "refs/tags/$t"
            fi
          done

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          for p in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            goos=${p%/*}
            goarch=${p#*/}
            ext=
            if [[ $goos == windows ]]; then ext=.exe; fi
            f="$dist/velourbbs-$TAG-$goos-$goarch$ext"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath -o "$f" ./cmd/velourbbs
            v=$(go version -m "$f" | awk '$1 == "mod" { print $3 }')
            if [[ $v != "$TAG" ]]; then
              echo "::error::$f has the version '$v', not $TAG"
              exit 1
            fi
          done
          cd "$dist"
          sha256sum velourbbs-* > SHA256SUMS

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "The release of $TAG exists. It does not change."
            exit 0
          fi
          # gh links the release to the remote tag: it must still be on the built commit.
          git fetch --no-tags origin "refs/tags/$TAG"
          if [[ $(git rev-parse --verify 'FETCH_HEAD^{commit}') != $(git rev-parse HEAD) ]]; then
            echo "::error::The remote tag $TAG moved during the run"
            exit 1
          fi
          flags=(--verify-tag --generate-notes)
          if [[ $TAG == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" "$RUNNER_TEMP"/dist/*

      - name: Write the SSH files
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

      - name: Deploy the home BBS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          BBS_PORT: ${{ secrets.BBS_PORT }}
        run: |
          d=$RUNNER_TEMP/ssh
          remote=(ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$d/known_hosts"
            -o IdentitiesOnly=yes -o BatchMode=yes -i "$d/key" -p "${DEPLOY_SSH_PORT:-22}"
            -- "$DEPLOY_USER@$DEPLOY_HOST")
          echo "Tag: $TAG"
          m=$("${remote[@]}" uname -m)
          case $m in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *)
              echo "::error::The host architecture '$m' is not supported"
              exit 1
              ;;
          esac
          echo "Host architecture: $m"
          b=$RUNNER_TEMP/bundle
          mkdir -p "$b/units"
          cp "$RUNNER_TEMP/dist/velourbbs-$TAG-linux-$arch" "$b/velourbbs"
          cp deploy/install.sh "$b/"
          cp deploy/velourbbs.service "$b/units/"
          sed "s/@PORT@/$BBS_PORT/" deploy/velourbbs.socket > "$b/units/velourbbs.socket"
          # The remote command runs in the home directory of the user.
          # The tag matches the check of the first step: it is safe in the remote command.
          in=velourbbs/incoming/$TAG
          tar -czh -C "$b" velourbbs units install.sh -C "$PWD" station |
            "${remote[@]}" "rm -rf $in && mkdir -p $in && tar -xzf - -C $in"
          echo "Sent the bundle"
          "${remote[@]}" "sh $in/install.sh $TAG"
