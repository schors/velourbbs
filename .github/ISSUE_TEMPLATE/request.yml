name: Feature request
description: Ask for a new feature or a change.
labels: [request, backlog]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What do you want the BBS to do?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why do you need it? What do you do now?
