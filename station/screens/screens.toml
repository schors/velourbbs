# The home station of Velour. The theme gives the roles of the brandbook,
# docs/brand/brandbook.md, section 3.

[screen]
width = [80, 80]
align = "left"
fill = "spaces"
more = "    Any key Next"
time = "15:04 MST"
zone = "UTC"

[lang.ru]
more = "    Любая клавиша Дальше"

